<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<header>
        <div class="login_y_registro">

            <a href="./index.html">

            </form>

</header>
<body>

            <div>
                <div><label for="email">Email: </label></div>
                <input class="input_login" type="email" name="email" value="" placeholder="ejemplo@algo.com" required>
            </div>
        |   <div>
                <div><label for="contraseña">Contraseña: </label></div>
                <input class="input_login" type="contraseña" name="contraseña" value="" placeholder="contraseña" required>
            </div>
            <div>
                <button type="submit">Ingresar</button>
                <a href="./register.html">No tengo cuenta</a>
            </div>

        </form>
    </div>
<footer></footer>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <div class="login_y_registro">
            <a href="login.html" class="login">Login</a>
            <span class="login">|</span>
            <a href="register.html" class="registro" >Registrate</a>
        </div>
        <div class="div_logo">
            <a href="./index.html">
                <img class="logo" src="./img/logo.png" alt="logo">
            </a>
            <form class="buscador" action="./search-results.html" method="GET">
                <input class="input_buscador" type="text" name="buscador" placeholder="Buscar productos..." required>
                <button type="submit">Buscar</button>
            </form>
        </div>
    </header>
    <div class="contenedor_register">
    <form class="form_register" action="./login.html" method="get">
        <div>
            <div><label>Email: </label></div>
            <input type="email" name="email" value="" placeholder="ejemplo@algo.com"></div>
        <div>
            <div><label>Contraseña: </label></div>
            <input type="contraseña" name="contraseña" value="" placeholder="contraseña">
        </div>
        <div class="campo">
            <div><label for="confirmPassword">Repetir contraseña:</label></div>
            <input type="password" required placeholder="contraseña"> </div>

        <div>
            <div><label>Términos y condiciones</label></div>
            <input type="checkbox" name="terminos" value="Acepto"> Acepto
            <input type="checkbox" name="terminos" value="No acepto"> No acepto
        </div>
        <div>
            <button type="submit">Registrarme</button>
        </div>
        <div>
            <a href="./login.html">Ya tengo cuenta</a>
        </div>
    </form>
    </div>
    <footer>
        <div class="redes">
            <ul>
                <li>
                    <a href="https://www.instagram.com/offsidestore8?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==" target="_blank">
                        <img src="./img/ig.jpg" alt="Instagram" class="icono-red"> Instagram
                    </a>
                </li>
                <li>
                    <a href="https://www.tiktok.com/@offside.store6" target="_blank">
                        <img src="./img/tiktok.png" alt="TikTok" class="icono-red"> TikTok
                    </a>
                </li>
            </ul>
        </div>
        <div class="integrantes">
            <ul>
                <li>Juan Ignacio Noguera</li>
                <li>Santiago Cesarini</li>
                <li>Tomás Jasnis</li>
            </ul>
        </div>
    </footer>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offside Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>

        <div class="div_logo">
            <a href="./index.html">
                <img class="logo" src="./img/logo.png" alt="logo">
            </a>
        </div>
        <form class="buscador" action="./search-results.html" method="GET">
            <input class="input_buscador" type="text" name="q" placeholder=" ⌕   Buscar productos...  " >
            <button class="boton_buscador" type="submit"> ⌕</button>
            <p class="error_caracteres"></p>
        </form>
        <nav class="login_y_registro">
            <ul class="lista_login_y_register">
                <li><a href="./login.html" class="login">Login</a></li>
                <li class="separador_login_register">|</li>
                <li><a href="./register.html" class="registro" >Registrate</a></li>
            </ul> 
        </nav>
    </header>
    <div class="contenedor_register">
    <form class="form_register" action="./login.html" method="get">
            <h2>Crear una cuenta</h2>
        
            <div><label for="email_registro" class="negrita">Email: </label></div>
            <input id="email_registro" class="input_register" type="email" name="email" value="" placeholder="ejemplo@algo.com">
            <p class="error_email_registro"></p>
        
            <div><label for="contrasena_primera_vez"  class="negrita">Contraseña: </label></div>
            <input  id="contrasena_primera_vez"  class="input_register" type="password" name="contrasena" value="" placeholder="contraseña">
            <p class="error_primer_contrasena_registro"></p>
        
            <div><label for="repetir_contrasena" class="negrita">Repetir contraseña:</label></div>
            <input  id="repetir_contrasena"  class="input_register" type="password"  placeholder="contraseña"  > 
            <p class="error_repetir_contrasena_registro"></p>
            <div>
    
                <input  id="acepto_terminos" type="checkbox" name="terminos" value="true" > 
                <label  for="acepto_terminos">Acepto los terminos y condiciones</label>
                <p class="terminos_error"></p>
            </div>
        
        
            <div><button class="boton_register" type="submit">Registrarme</button></div>
        
        
            <div><a class="ya_tengo_cuenta" href="./login.html">Ya tengo cuenta</a></div>
        
    </form>
    </div>
    <footer>
        <div class="redes">
            <ul>
                <li>
                    <a href="https://www.instagram.com/offsidestore8?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==" target="_blank">
                        <img src="./img/ig.jpg" alt="Instagram" class="icono-red"> Instagram
                    </a>
                </li>
                <li>
                    <a href="https://www.tiktok.com/@offside.store6" target="_blank">
                        <img src="./img/tiktok.png" alt="TikTok" class="icono-red"> TikTok
                    </a>
                </li>
            </ul>
        </div>
        <div class="integrantes">
            <ul>
                <li class="nombres_footer">Juan Ignacio Noguera</li>
                <li class="nombres_footer">Santiago Cesarini</li>
                <li class="nombres_footer">Tomás Jasnis</li>
            </ul>
        </div>
    </footer>

    <script src="./js/register.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offside Store</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <header>

        <div class="div_logo">
            <a href="./index.html">
                <img class="logo" src="./img/logo.png" alt="logo">
            </a>
        </div>
        <form class="buscador" action="./search-results.html" method="GET">
            <input class="input_buscador" type="text" name="buscador" placeholder=" ⌕   Buscar productos...  " required>
            <button class="boton_buscador" type="submit"> ⌕</button>
        </form>
        <nav class="login_y_registro">
            <a href="./login.html" class="login">Login</a>
            <span class="login">|</span>
            <a href="./register.html" class="registro" >Registrate</a>
        </nav>
    </header>
    <div class="contenedor_register">
    <form class="form_register" action="./login.html" method="get">
            <h2>Crear una cuenta</h2>
        
            <div><label for="email_registro" class="negrita">Email: </label></div>
            <input id="email_registro" class="input_register" type="email" name="email" value="" placeholder="ejemplo@algo.com">
        
            <div><label for="contraseña_primera_vez"  class="negrita">Contraseña: </label></div>
            <input  id="contraseña_primera_vez"  class="input_register" type="contraseña" name="contraseña" value="" placeholder="contraseña">
        
        
            <div><label for="repetir_contraseña" class="negrita">Repetir contraseña:</label></div>
            <input  id="repetir_contraseña"  class="input_register" type="password"  placeholder="contraseña"required > 

            <div>
                <div>
                    <label for="pregunta_terminos_y_condiciones" class="negrita">Términos y condiciones</label>
                </div>
                <input  id="acepto_terminos" type="checkbox" name="terminos" value="Acepto"> 
                <label for="acepto_terminos">Acepto</label>
                <input  id="no_acepto_terminos"  type="checkbox" name="terminos" value="No acepto"> 
                <label  id="no_acepto_terminos">No acepto</label>
            </div>
        
        
            <div><button class="boton_register" type="submit">Registrarme</button></div>
        
        
            <div><a class="ya_tengo_cuenta" href="./login.html">Ya tengo cuenta</a></div>
        
    </form>
    </div>
    <footer>
        <div class="redes">
            <ul>
                <li>
                    <a href="https://www.instagram.com/offsidestore8?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==" target="_blank">
                        <img src="./img/ig.jpg" alt="Instagram" class="icono-red"> Instagram
                    </a>
                </li>
                <li>
                    <a href="https://www.tiktok.com/@offside.store6" target="_blank">
                        <img src="./img/tiktok.png" alt="TikTok" class="icono-red"> TikTok
                    </a>
                </li>
            </ul>
        </div>
        <div class="integrantes">
            <ul>
                <li class="nombres_footer">Juan Ignacio Noguera</li>
                <li class="nombres_footer">Santiago Cesarini</li>
                <li class="nombres_footer">Tomás Jasnis</li>
            </ul>
        </div>
    </footer>
    
</body>
</html>
